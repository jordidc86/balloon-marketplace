name: Send Bi-Weekly Newsletter Cron

# Production newsletter scheduler.
# Keep this as the single recurring newsletter trigger; do not add a duplicate
# Netlify scheduled function unless the scheduler ownership changes.
on:
  schedule:
    - cron: '0 9 1,16 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate without sending emails'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      test_email:
        description: 'Optional single recipient for manual smoke tests'
        required: false
        type: string

concurrency:
  group: newsletter-cron
  cancel-in-progress: false

jobs:
  dispatch_newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_URL: https://aerotrade.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Trigger newsletter endpoint
        id: newsletter
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not configured in GitHub Actions secrets."
            exit 1
          fi

          base_url="${PRODUCTION_URL%/}"
          if [[ ! "$base_url" =~ ^https://[^[:space:]]+$ ]]; then
            echo "::error::Invalid PRODUCTION_URL: $base_url"
            exit 1
          fi

          query="days=15&mix=true"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              query="${query}&dryRun=true"
            fi

            if [ -n "${{ inputs.test_email }}" ]; then
              encoded_email="$(python3 - <<'PY'
          import os
          import urllib.parse
          print(urllib.parse.quote(os.environ["TEST_EMAIL"]))
          PY
              )"
              query="${query}&testEmail=${encoded_email}"
            fi
          fi

          url="${base_url}/api/cron/newsletter?${query}"
          body_file="$(mktemp)"

          http_status="$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 10 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 180 \
              --output "$body_file" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer ${CRON_SECRET}" \
              "$url"
          )"

          body="$(cat "$body_file")"
          echo "HTTP status: ${http_status}"
          echo "Response body:"
          echo "$body"

          {
            echo "### Newsletter cron result"
            echo ""
            echo "- URL: \`${base_url}/api/cron/newsletter\`"
            echo "- HTTP status: \`${http_status}\`"
            echo ""
            echo '```json'
            echo "$body"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Newsletter endpoint returned HTTP ${http_status}."
            exit 1
          fi

          if ! jq -e . "$body_file" >/dev/null 2>&1; then
            echo "::error::Newsletter endpoint did not return valid JSON."
            exit 1
          fi

          failed_count="$(jq -r '.failedCount // 0' "$body_file")"
          success_value="$(jq -r '.success // empty' "$body_file")"

          if [ "$failed_count" != "0" ]; then
            echo "::error::Newsletter reported ${failed_count} failed email deliveries."
            exit 1
          fi

          if [ "$success_value" = "false" ]; then
            echo "::error::Newsletter endpoint reported success=false."
            exit 1
          fi
        env:
          TEST_EMAIL: ${{ inputs.test_email }}
