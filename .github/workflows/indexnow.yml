name: Submit Public AeroTrade URLs to IndexNow

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

concurrency:
  group: aerotrade-indexnow
  cancel-in-progress: false

jobs:
  submit_public_urls:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PRODUCTION_URL: https://aerotrade.app
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Submit current public inventory
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET is not configured."
            exit 1
          fi

          body_file="$(mktemp)"
          http_status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 90 \
            --output "$body_file" --write-out "%{http_code}" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_URL%/}/api/cron/indexing?commit=1")"
          body="$(cat "$body_file")"
          echo "HTTP status: ${http_status}"
          echo "$body"

          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            echo "::error::Indexing endpoint returned HTTP ${http_status}."
            exit 1
          fi
          jq -e '.accepted == true and (.urlCount | type == "number")' "$body_file" >/dev/null
